# Clash (mihomo) 代理池 Docker 部署
#
# 用法:
#   1. 把订阅链接导出的 config.yaml 放到 ./config/config.yaml
#   2. 修改 .env 中的 CLASH_SECRET（与 config.yaml 的 secret 一致）
#   3. docker compose up -d
#
# 端口映射（仅绑定本机回环，不对外暴露）:
#   主机 9099 → 容器 9090  Clash API（供 ClashManager 切换节点）
#   主机 7777 → 容器 7890  代理端口（爬虫请求走这里）
services:
  clash:
    image: metacubex/mihomo:latest
    container_name: clash_proxy_pool
    restart: always
    volumes:
      - "./config:/root/.config/mihomo"
    ports:
      - "127.0.0.1:9099:9090"   # API
      - "127.0.0.1:7777:7890"   # 代理
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
